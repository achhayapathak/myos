<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a3a3a3" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="750 250" />

  <!-- Inner Circle -->
  <circle cx="256" cy="256" r="96" fill="#1f1f1f" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" />

  <!-- Core Glyph (Stylized OS Monogram) -->
  <path d="M208 200 L208 312 M208 240 L256 280 L304 240 M304 200 L304 312" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>
